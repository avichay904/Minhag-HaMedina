# Render Blueprint — Minhag HaMedina
# Deploy: connect repo in Render dashboard → "New Blueprint" → select this file.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: mhm-postgres
    databaseName: minhag_hamedina
    user: mhm
    plan: free           # change to 'starter' or above for production
    region: oregon        # match your web service region

services:
  # ── API (NestJS / Docker) ──────────────────────────────────────────────────
  - type: web
    name: mhm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter         # free tier has limited memory; starter recommended
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mhm-postgres
          property: connectionString
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        sync: false       # set manually in Render dashboard
      - key: ADMIN_API_TOKEN
        sync: false       # set manually in Render dashboard
      - key: IDENTITY_MODE
        value: live
      - key: GOOGLE_CLIENT_ID
        sync: false       # required when IDENTITY_MODE=live
      - key: APPLE_CLIENT_ID
        sync: false       # optional
      - key: FCM_PROJECT_ID
        sync: false       # optional — enables push notifications
      - key: FCM_SERVER_KEY
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false

  # ── Web (React SPA — static site) ─────────────────────────────────────────
  - type: web
    name: mhm-web
    runtime: static
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @mhm/shared --filter @mhm/contracts build &&
      pnpm --filter @mhm/web build
    staticPublishPath: ./apps/web/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "no-store"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: mhm-api
          type: web
          property: host
          # Render exposes the service URL; prefix with https://
          # If auto-wiring doesn't apply the https scheme, set it manually:
          # value: https://<your-api-service>.onrender.com

  # ── Admin (React SPA — static site) ───────────────────────────────────────
  - type: web
    name: mhm-admin
    runtime: static
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @mhm/shared --filter @mhm/contracts build &&
      pnpm --filter @mhm/admin build
    staticPublishPath: ./apps/admin/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "no-store"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: mhm-api
          type: web
          property: host
          # Render exposes the service URL; prefix with https://
          # If auto-wiring doesn't apply the https scheme, set it manually:
          # value: https://<your-api-service>.onrender.com
